<svg width="400" height="320" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Person looking at a checklist</title>
<desc id="desc">Stylised illustration of a person standing beside a large checklist with completed items.</desc>
<!-- Removed background container rectangle for embedded appearance -->
<!-- Board shadow -->
<rect x="140" y="46" width="170" height="228" rx="14" fill="#0f172a" opacity="0.06"/>
<!-- Checklist board -->
<rect x="132" y="40" width="170" height="228" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<rect x="152" y="62" width="64" height="10" rx="5" fill="#CBD5E1"/>
<!-- Checklist lines -->
<g stroke="#E2E8F0" stroke-linecap="round" stroke-width="4">
  <line x1="152" y1="96" x2="276" y2="96"/>
  <line x1="152" y1="122" x2="268" y2="122"/>
  <line x1="152" y1="148" x2="260" y2="148"/>
  <line x1="152" y1="174" x2="270" y2="174"/>
  <line x1="152" y1="200" x2="248" y2="200"/>
</g>
<!-- Checkmarks -->
<g fill="none" stroke="#22C55E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M142 92l6.5 6.5 12-13"/>
  <path d="M142 118l6.5 6.5 12-13"/>
  <path d="M142 144l6.5 6.5 12-13"/>
  <path d="M142 170l6.5 6.5 12-13"/>
  <path d="M142 196l6.5 6.5 12-13"/>
</g>
<!-- Person -->
<g>
  <!-- Head -->
  <circle cx="92" cy="118" r="22" fill="#0F172A"/>
  <!-- Body -->
  <path d="M76 146c0-10 8-18 18-18h0c10 0 18 8 18 18v58H76v-58z" fill="#22C55E"/>
  <!-- Arm -->
  <path d="M112 160c10 3 16 10 20 22l6 18h-18l-8-20" fill="#16A34A"/>
  <!-- Left arm pointing at checklist -->
  <path d="M92 156c-6 12-10 24-10 36h16c0-8 2-16 6-24l-12-12z" fill="#059669"/>
  <!-- Legs -->
  <path d="M76 204h16v34H76z" fill="#0F172A"/>
  <path d="M94 204h18v34H94z" fill="#1E293B"/>
  <!-- Shoes -->
  <rect x="74" y="236" width="20" height="8" rx="3" fill="#334155"/>
  <rect x="92" y="236" width="24" height="8" rx="3" fill="#334155"/>
</g>
<!-- Accent circles -->
<circle cx="310" cy="72" r="8" fill="#D1FAE5"/>
<circle cx="318" cy="232" r="14" fill="#E0F2FE"/>
<circle cx="182" cy="262" r="10" fill="#FEE2E2"/>
</svg>
