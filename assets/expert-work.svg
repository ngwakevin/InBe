<?xml version="1.0" encoding="UTF-8"?>
<svg width="420" height="520" viewBox="0 0 420 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">InBeas Work Expert Illustration</title>
  <desc id="desc">Friendly expert character holding a green briefcase with checkmarks floating around.</desc>
  <defs>
    <linearGradient id="shirt" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bgblob" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- background blob -->
  <path d="M60 120C60 80 120 40 190 40C260 40 330 90 350 150C372 215 340 270 300 310C255 354 190 380 140 360C85 338 60 290 60 240V120Z" fill="url(#bgblob)" opacity="0.6"/>

  <!-- confetti checkmarks -->
  <g stroke="#16a34a" stroke-width="6" stroke-linecap="round">
    <path d="M320 120 l10 10 l18 -22"/>
    <path d="M280 80 l10 10 l18 -22"/>
    <path d="M340 190 l10 10 l18 -22"/>
  </g>

  <!-- character -->
  <g transform="translate(70,120)" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <circle cx="110" cy="40" r="26" fill="#fde68a"/>
    <path d="M92 42 q18 14 36 0" stroke="#0f172a" fill="none"/>
    <circle cx="100" cy="40" r="3" fill="#0f172a"/>
    <circle cx="120" cy="40" r="3" fill="#0f172a"/>
    <path d="M96 26 c8 -10 28 -8 36 4" fill="none"/>

    <!-- hair -->
    <path d="M86 34 c6 -22 48 -28 62 -4" fill="none" stroke="#334155"/>

    <!-- body -->
    <rect x="70" y="70" width="80" height="90" rx="12" fill="url(#shirt)"/>
    <path d="M70 92 h80" stroke="#94a3b8"/>
    <path d="M70 112 h80" stroke="#94a3b8"/>
    <path d="M70 132 h80" stroke="#94a3b8"/>

    <!-- legs -->
    <path d="M92 160 v52"/>
    <path d="M128 160 v52"/>
    <rect x="80" y="212" width="32" height="12" rx="6" fill="#0ea5e9"/>
    <rect x="116" y="212" width="32" height="12" rx="6" fill="#22c55e"/>

    <!-- right arm to briefcase -->
    <path d="M150 96 c34 6 48 20 64 36" fill="none"/>
    <circle cx="214" cy="136" r="6" fill="#0f172a"/>

    <!-- left arm waving -->
    <path d="M70 96 c-26 -8 -40 -8 -56 -2" fill="none"/>
    <circle cx="12" cy="100" r="6" fill="#0f172a"/>
  </g>

  <!-- briefcase -->
  <g transform="translate(270,140)" filter="url(#shadow)">
    <rect x="0" y="0" width="84" height="56" rx="10" fill="#22c55e" stroke="#0f172a" stroke-width="4"/>
    <rect x="28" y="-12" width="28" height="16" rx="6" fill="#16a34a" stroke="#0f172a" stroke-width="4"/>
    <path d="M10 26 h64" stroke="#0f172a" stroke-width="4"/>
  <g transform="translate(16,12)">
      <circle cx="10" cy="16" r="8" fill="#ffffff"/>
      <path d="M6 16 l4 4 l8 -10" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  
</svg>
