<?xml version="1.0" encoding="UTF-8"?>
<svg width="420" height="520" viewBox="0 0 420 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">InBeas Newcomer Illustration</title>
  <desc id="desc">Friendly newcomer holding a map and suitcase with location pins around.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <path d="M60 110C60 70 120 36 188 36C260 36 330 92 352 152C374 212 340 274 298 310C252 348 184 372 138 352C86 330 60 286 60 240V110Z" fill="url(#bg)"/>

  <!-- pins -->
  <g fill="#0ea5e9">
    <path d="M320 130 a8 8 0 1 0 0.01 0"/>
    <path d="M286 88 a6 6 0 1 0 0.01 0"/>
    <path d="M344 192 a7 7 0 1 0 0.01 0"/>
  </g>

  <!-- character -->
  <g transform="translate(80,120)" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <circle cx="100" cy="40" r="24" fill="#fde68a"/>
    <circle cx="94" cy="40" r="3" fill="#0f172a"/>
    <circle cx="108" cy="40" r="3" fill="#0f172a"/>
    <path d="M92 28 c10 -10 28 -8 34 2" fill="none"/>
    <path d="M88 34 c6 -18 40 -24 52 -4" stroke="#334155"/>

    <!-- body with map -->
    <rect x="70" y="70" width="72" height="80" rx="10" fill="#ffffff"/>
    <path d="M74 88 l20 -10 l20 12 l22 -12 l4 16 l-26 16 l-18 -12 l-22 10 z" fill="#dbeafe"/>

    <!-- suitcase -->
    <g transform="translate(150,120)" filter="url(#shadow)">
      <rect x="0" y="0" width="64" height="44" rx="8" fill="#22c55e" stroke="#0f172a" stroke-width="4"/>
      <rect x="20" y="-10" width="24" height="12" rx="4" fill="#16a34a" stroke="#0f172a" stroke-width="4"/>
    </g>

    <!-- legs -->
    <path d="M92 150 v52"/>
    <path d="M124 150 v52"/>
    <rect x="82" y="202" width="28" height="10" rx="5" fill="#0ea5e9"/>
    <rect x="116" y="202" width="28" height="10" rx="5" fill="#22c55e"/>

    <!-- arms -->
    <path d="M70 96 c-24 -8 -36 -8 -50 -2"/>
    <path d="M142 96 c22 2 36 10 46 22"/>
  </g>

  
</svg>
