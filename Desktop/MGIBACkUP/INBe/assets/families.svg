<?xml version="1.0" encoding="UTF-8"?>
<svg width="420" height="520" viewBox="0 0 420 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">InBeas Families Illustration</title>
  <desc id="desc">Two parents and a child with a heart and school icon, friendly style.</desc>
  <defs>
    <linearGradient id="bgf" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>

  <path d="M60 120C60 80 120 40 190 40C260 40 330 90 350 150C372 215 340 270 300 310C255 354 190 380 140 360C85 338 60 290 60 240V120Z" fill="url(#bgf)"/>

  <!-- icons -->
  <g stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M320 100 c10 -8 20 -8 30 0 c-10 20 -20 20 -30 0"/>
  </g>
  <g stroke="#0ea5e9" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(300,170)">
    <rect x="0" y="0" width="40" height="26" rx="4"/>
    <path d="M0 10 h40"/>
  </g>

  <!-- family group -->
  <g transform="translate(70,140)" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- parent 1 -->
    <circle cx="70" cy="40" r="22" fill="#fde68a"/>
    <rect x="48" y="70" width="44" height="70" rx="10" fill="#e2e8f0"/>

    <!-- parent 2 -->
    <circle cx="150" cy="36" r="24" fill="#fde68a"/>
    <rect x="128" y="66" width="48" height="78" rx="10" fill="#dbeafe"/>

    <!-- child -->
    <circle cx="112" cy="64" r="16" fill="#fde68a"/>
    <rect x="100" y="86" width="24" height="44" rx="8" fill="#fef3c7"/>

    <!-- hands -->
    <path d="M72 110 h28"/>
    <path d="M124 110 h28"/>

    <!-- feet -->
    <rect x="56" y="140" width="28" height="10" rx="5" fill="#0ea5e9"/>
    <rect x="140" y="146" width="28" height="10" rx="5" fill="#22c55e"/>
    <rect x="100" y="128" width="20" height="8" rx="4" fill="#94a3b8"/>
  </g>

  
</svg>
