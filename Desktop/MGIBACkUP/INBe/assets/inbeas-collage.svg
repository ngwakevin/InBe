<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="360" viewBox="0 0 680 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">InBeas Audience Collage</title>
  <desc id="desc">A friendly collage of people holding balloons representing newcomers, skilled workers, families, students, and asylum seekers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- rounded background -->
  <rect x="4" y="4" width="672" height="352" rx="24" fill="url(#bg)"/>

  <!-- confetti dots -->
  <g opacity="0.6">
    <circle cx="90" cy="70" r="3" fill="#0ea5e9"/>
    <circle cx="220" cy="46" r="3" fill="#22c55e"/>
    <circle cx="320" cy="80" r="3" fill="#f59e0b"/>
    <circle cx="540" cy="56" r="3" fill="#ef4444"/>
    <circle cx="610" cy="98" r="3" fill="#0ea5e9"/>
  </g>

  <!-- Balloon helper -->
  <g id="balloon" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 40 C 10 22 28 22 38 40 C 44 52 40 64 22 70 C 4 64 0 52 6 40 Z" fill="#22c55e"/>
    <path d="M22 70 v80"/>
  </g>

  <!-- Character helper -->
  <g id="person" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="10" fill="#fde68a"/>
    <path d="M0 10 v26"/>
    <path d="M0 18 l-14 12"/>
    <path d="M0 18 l14 12"/>
    <path d="M0 36 l-10 18"/>
    <path d="M0 36 l10 18"/>
  </g>

  <!-- Newcomer (map green) -->
  <g transform="translate(90,220)" filter="url(#shadow)">
    <use href="#person"/>
    <rect x="-20" y="10" width="40" height="26" rx="4" fill="#dbeafe" stroke="#0f172a"/>
    <path d="M-18 14 l12 -6 l12 8 l12 -8 l2 10 l-16 10 l-10 -8 l-12 6 z" fill="#bfdbfe"/>
    <g transform="translate(34,-64) scale(0.9)">
      <use href="#balloon"/>
    </g>
  </g>

  <!-- Skilled worker (briefcase) -->
  <g transform="translate(230,210)" filter="url(#shadow)">
    <use href="#person"/>
    <rect x="8" y="22" width="24" height="16" rx="3" fill="#22c55e" stroke="#0f172a"/>
    <rect x="12" y="14" width="16" height="8" rx="2" fill="#16a34a" stroke="#0f172a"/>
    <g transform="translate(30,-66)">
      <use href="#balloon"/>
    </g>
  </g>

  <!-- Asylum / support (document) -->
  <g transform="translate(360,230)" filter="url(#shadow)">
    <use href="#person"/>
    <rect x="-6" y="14" width="24" height="28" rx="3" fill="#fff" stroke="#0f172a"/>
    <path d="M-2 22 h16" stroke="#94a3b8"/>
    <path d="M-2 28 h12" stroke="#94a3b8"/>
    <g transform="translate(22,-64)">
      <use href="#balloon"/>
    </g>
  </g>

  <!-- Student (card + cap) -->
  <g transform="translate(500,215)" filter="url(#shadow)">
    <use href="#person"/>
    <rect x="6" y="18" width="26" height="16" rx="3" fill="#0ea5e9" stroke="#0f172a"/>
    <path d="M8 24 h18" stroke="#0f172a"/>
    <path d="M8 28 h10" stroke="#0f172a"/>
    <g transform="translate(34,-66)">
      <use href="#balloon"/>
    </g>
    <g transform="translate(-8,-20)" stroke="#0f172a" stroke-width="3">
      <path d="M0 -8 l18 -6 l18 6 l-18 6 z" fill="#0ea5e9"/>
      <path d="M36 -8 v14"/>
    </g>
  </g>

  <!-- Family (two parents + child, heart balloon) -->
  <g transform="translate(620,235)" filter="url(#shadow)">
    <!-- parent left -->
    <g transform="translate(-32,0)">
      <use href="#person"/>
    </g>
    <!-- parent right -->
    <g transform="translate(4,0)">
      <use href="#person"/>
    </g>
    <!-- child -->
    <g transform="translate(-10,16) scale(0.8)">
      <use href="#person"/>
    </g>
    <!-- heart balloon -->
    <g transform="translate(-4,-66)" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 40 v74"/>
      <path d="M0 40 c-10 -12 -2 -28 12 -26 c10 2 12 10 12 10 s2 -8 12 -10 c14 -2 22 14 12 26 c-10 12 -24 18 -24 18 s-14 -6 -24 -18z" fill="#ef4444"/>
    </g>
  </g>
</svg>
